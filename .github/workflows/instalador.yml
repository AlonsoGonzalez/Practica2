name: Instalador de Windows

# Compila el instalador en un Windows real y lo PRUEBA (programa suelto, instalacion silenciosa,
# venta completa, desinstalacion que conserva los datos).
#  - Al publicar una etiqueta (git tag v1.0.0 && git push --tags) usa TU llave: pos/clave_publica.pem.
#  - En cualquier otra ejecucion, si falta esa llave, genera una de PRUEBA (el instalador resultante
#    sirve para probar, nunca para vender: sus licencias no las puedes emitir tu).
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["instalador/**", "servidor.py", "ventana.py", "pos/**", "requirements*.txt", ".github/workflows/instalador.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      POS_SIN_DIALOGOS: "1"   # que ningun aviso espere un clic en el servidor de pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt

      - name: Pruebas automaticas en Windows (informativo)
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m pytest -q -p no:cacheprovider --durations=8 2>&1 | Tee-Object -FilePath tests.log
          exit $LASTEXITCODE

      - name: Llave publica
        id: llave
        shell: bash
        run: |
          if [ -f pos/clave_publica.pem ]; then
            echo "prueba=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "Falta pos/clave_publica.pem: no se publica una version sin tu llave."; exit 1
          else
            python tools/licencias.py generar-llaves --salida llaves-prueba
            cp llaves-prueba/publica.pem pos/clave_publica.pem
            echo "prueba=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Se uso una llave de PRUEBA. Este instalador NO sirve para vender."
          fi

      - name: Empaquetar con PyInstaller
        run: pyinstaller --noconfirm instalador/pos.spec

      - name: Prueba de humo del programa suelto (con ventana)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $args = @("dist\PuntoDeVenta\PuntoDeVenta.exe", "--datos", "$env:RUNNER_TEMP\datos-con-ventana")
          if (Test-Path llaves-prueba\privada.pem) { $args += @("--llaves", "llaves-prueba") }
          python instalador\prueba_humo.py @args
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prueba de humo del programa suelto (sin ventana)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $args = @("dist\PuntoDeVenta\PuntoDeVenta.exe", "--sin-ventana", "--datos", "$env:RUNNER_TEMP\datos-sin-ventana")
          if (Test-Path llaves-prueba\privada.pem) { $args += @("--llaves", "llaves-prueba") }
          python instalador\prueba_humo.py @args
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compilar instalador (Inno Setup)
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"   # Git Bash convertiria /DVersion=... en una ruta de archivo
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0-prueba"
          "$ISCC" "/DVersion=$VERSION" instalador/pos.iss
          ls -la salida

      - name: Instalar en silencio, probar lo instalado y desinstalar
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = (Get-ChildItem salida\PuntoDeVenta-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "pos-instalado"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\PuntoDeVenta.exe")) { throw "El instalador no dejo el programa en $dir" }
          Write-Host "Instalado en $dir"
          $args = @("$dir\PuntoDeVenta.exe", "--sin-ventana")
          if (Test-Path llaves-prueba\privada.pem) { $args += @("--llaves", "llaves-prueba") }
          python instalador\prueba_humo.py @args
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $datos = Join-Path $env:APPDATA "PuntoVentaAbarrotes"
          if (-not (Test-Path "$datos\pos.db")) { throw "No se creo la base de datos en $datos" }
          # el cierre de turno de la prueba de humo debe haber dejado un respaldo con las ventas
          if (-not (Get-ChildItem "$datos\respaldos" -Filter "pos-*-cierre-turno.db" -ErrorAction SilentlyContinue)) { throw "No hay respaldo del cierre de turno en $datos\respaldos" }
          Write-Host "OK: el cierre de turno genero su respaldo"

          # la opcion de tablet NO debe sobrevivir a una reinstalacion: se marca a mano y se reinstala encima
          '{"lan": true}' | Set-Content -Path "$datos\config.json" -Encoding utf8
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if ((Get-Content "$datos\config.json" -Raw) -match '"lan"\s*:\s*true') { throw "La reinstalacion dejo la tablet activada" }
          if (-not (Test-Path "$datos\pos.db")) { throw "Reinstalar borro los datos de la tienda" }
          Write-Host "OK: reinstalar apaga la tablet y conserva los datos"

          # regla del Firewall para redes privadas (el runner es administrador): se crea y cubre el perfil Privado
          $p = Start-Process -FilePath "$dir\PuntoDeVenta.exe" -ArgumentList "--permitir-firewall" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "No se pudo crear la regla del Firewall (codigo $($p.ExitCode))" }
          $regla = netsh advfirewall firewall show rule name="Punto de Venta (acceso desde tablet)" | Out-String
          if ($regla -notmatch "Private") { throw "La regla del Firewall no cubre el perfil Privado:`n$regla" }
          if ($regla -match "Public" -and $regla -notmatch "Domain,Private|Private,Domain") { throw "La regla cubre redes publicas:`n$regla" }
          Write-Host "OK: la regla del Firewall cubre redes privadas"

          # el desinstalador debe cerrar el programa si esta abierto
          $env:POS_NO_BROWSER = "1"
          $app = Start-Process -FilePath "$dir\PuntoDeVenta.exe" -ArgumentList "--sin-ventana" -PassThru
          $vivo = $false
          foreach ($i in 1..40) { try { Invoke-RestMethod "http://127.0.0.1:5000/api/ping" -TimeoutSec 2 | Out-Null; $vivo = $true; break } catch { Start-Sleep -Milliseconds 500 } }
          if (-not $vivo) { throw "El programa instalado no respondio antes de desinstalar" }
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Get-Process -Id $app.Id -ErrorAction SilentlyContinue) { throw "El desinstalador dejo el programa corriendo" }
          try { Invoke-RestMethod "http://127.0.0.1:5000/api/ping" -TimeoutSec 2 | Out-Null; throw "El puerto 5000 sigue abierto tras desinstalar" } catch { if ($_.Exception.Message -like "*sigue abierto*") { throw } }
          if (Test-Path "$dir\PuntoDeVenta.exe") { throw "El desinstalador no quito el programa" }
          if (-not (Test-Path "$datos\pos.db")) { throw "Desinstalar borro los datos de la tienda" }
          Write-Host "OK: desinstalar cierra el programa, lo quita y conserva los datos"

      - name: Licencia temporal para probar el instalador de PRUEBA
        if: steps.llave.outputs.prueba == 'true'
        shell: bash
        run: |
          # Solo sirve con ESTE instalador (su llave publica de prueba es unica y su privada se descarta).
          python tools/licencias.py emitir --privada llaves-prueba/privada.pem --tienda "PRUEBA - no es una venta real" \
            --tipo prueba --expira "$(date -d '+30 days' +%F)" > salida/LICENCIA-DE-PRUEBA.txt
          printf '\nPega esta clave en la pantalla "Activar licencia" del instalador de prueba.\nEs valida 30 dias y solo funciona con ESTE instalador de prueba (no con una version real). No esta ligada al ID de instalacion: sirve en cualquier equipo donde instales este paquete de prueba.\n' >> salida/LICENCIA-DE-PRUEBA.txt
          cat salida/LICENCIA-DE-PRUEBA.txt | head -c 120; echo

      - name: Resumen de las pruebas automaticas en Windows
        if: always()
        shell: pwsh
        run: Get-Content tests.log -Tail 14

      - uses: actions/upload-artifact@v4
        if: steps.llave.outputs.prueba == 'false'
        with:
          name: PuntoDeVenta-Setup
          path: salida/*.exe
      - uses: actions/upload-artifact@v4
        if: steps.llave.outputs.prueba == 'true'
        with:
          name: PuntoDeVenta-Setup-SOLO-PRUEBA
          path: |
            salida/*.exe
            salida/LICENCIA-DE-PRUEBA.txt
